[project]
name = "omni-tests"
version = "0.1.0"
description = "Автотесты для OmniNotice"
requires-python = ">=3.8"
dependencies = [
    "playwright>=1.40.0",
    "prometheus-client>=0.20.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-playwright>=0.4.0",
    "pytest-html>=4.0.0",
    "pytest-json-report>=1.5.0",
    "pytest-xdist>=3.0.0",
    "allure-pytest>=2.13.0",
    "python-dotenv>=1.0.0",
]

[dependency-groups]
dev = [
    "pytest>=7.0.0",
    "pytest-playwright>=0.4.0",
    "pytest-html>=4.0.0",
    "pytest-json-report>=1.5.0",
    "pytest-xdist>=3.0.0",
    "allure-pytest>=2.13.0",
    "python-dotenv>=1.0.0",
]

[tool.pytest.ini_options]
minversion = "7.0"
addopts = "-v --tb=short --strict-markers"
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
markers = [
    "smoke: Быстрые тесты для проверки основных функций",
    "regression: Полный регрессионный набор",
    "recovery: Тесты восстановления пароля",
    "register: Тесты регистрации",
    "login: Тесты авторизации",
    "debug: Отладочные тесты",
]